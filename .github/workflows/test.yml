name: Go Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# This workflow only reads the checkout — every write belongs to release.yml,
# which declares its own scopes per job. Stating it here stops the token from
# inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: go-version
        run: |
          echo "go-version=$(cat .tool-versions | grep golang | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests
        run: go test -race ./...

      # kir exists to feed vulnerability scanners, so it should be scanned too.
      #
      # go-version-input holds the analysis to the Go this job already derived
      # from .tool-versions. govulncheck attributes standard-library advisories
      # to the toolchain it is given, so letting it pick a newer Go than kir is
      # built with would hide anything fixed upstream but still shipped here.
      #
      # cache is off because the steps above have already populated the module
      # cache; letting the action restore it again just collides with what is
      # on disk.
      - name: Check for known vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: ${{ steps.go-version.outputs.go-version }}
          check-latest: false
          cache: false
          repo-checkout: false
