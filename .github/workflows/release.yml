#yaml-language-server: $schema=https://json.schemastore.org/github-workflow

name: Release

on:
  push:
    branches:
      - master

# release-please needs to open/maintain its release PR and create releases/tags.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Maintains a Release PR from Conventional Commits. Merging that PR creates the
  # vX.Y.Z tag + GitHub Release, at which point release_created flips to true.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Only runs when release-please just cut a release. Builds signed multi-arch
  # binaries + image with GoReleaser and attaches them to that release. Runs in
  # the same workflow (not off a tag event) so the default GITHUB_TOKEN works.
  goreleaser:
    name: GoReleaser
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      packages: write # push image to GHCR
      id-token: write # cosign keyless signing
      attestations: write # record build provenance
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0

      # .tool-versions, not go.mod: go.mod's `go` directive is the minimum
      # language version the module needs — dependencies raise it, and it is not
      # a statement about which toolchain to build with. Reading .tool-versions
      # means releases are built with the same Go the Test workflow checks, so
      # what CI verifies and what ships cannot drift apart.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .tool-versions

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft (for SBOMs)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The cosign signature over checksums.txt establishes who published a
      # release; provenance establishes how it was built — which workflow, from
      # which commit, on which runner. Subjects are read from checksums.txt so
      # the attestation covers exactly the artifacts the signature already
      # covers, and cannot drift from them.
      - name: Attest build provenance for the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # GoReleaser's `sboms` block cannot cover an image — its `artifacts`
      # field accepts source, package, archive, binary, any or none, with no
      # image target — so the released image gets its SBOM here instead.
      #
      # The attestation is attached by digest, read back from the registry
      # rather than assumed from the tag, so it is bound to the exact manifest
      # GoReleaser just pushed.
      - name: Attest an SBOM for the published image
        env:
          IMAGE_REPO: mpv/kir
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"

          token="$(curl -fsSL \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${IMAGE_REPO}:pull" \
            | jq -r .token)"
          digest="$(curl -fsSL -o /dev/null -D- \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            "https://ghcr.io/v2/${IMAGE_REPO}/manifests/${version}" \
            | awk -F': ' 'tolower($1) == "docker-content-digest" { gsub(/\r/, ""); print $2 }')"

          if [ -z "${digest}" ]; then
            echo "could not resolve a digest for ghcr.io/${IMAGE_REPO}:${version}" >&2
            exit 1
          fi
          echo "attesting SBOM for ghcr.io/${IMAGE_REPO}@${digest}"

          syft "ghcr.io/${IMAGE_REPO}:${version}" -o spdx-json > sbom.spdx.json
          # spdxjson, not spdx: both carry the SPDX predicate type, but `spdx`
          # embeds the document as an opaque string while `spdxjson` parses it,
          # so consumers get a structured SBOM rather than JSON in a string.
          cosign attest --yes --type spdxjson \
            --predicate sbom.spdx.json \
            "ghcr.io/${IMAGE_REPO}@${digest}"
