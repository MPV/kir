# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: kir

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/mpv/kir/cmd.version={{ .Version }}
      - -X github.com/mpv/kir/cmd.commit={{ .FullCommit }}
      - -X github.com/mpv/kir/cmd.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

dockers:
  - image_templates:
      - "ghcr.io/mpv/kir:{{ .Version }}-amd64"
    use: buildx
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/mpv/kir"
  - image_templates:
      - "ghcr.io/mpv/kir:{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.source=https://github.com/mpv/kir"

docker_manifests:
  - name_template: "ghcr.io/mpv/kir:{{ .Version }}"
    image_templates:
      - "ghcr.io/mpv/kir:{{ .Version }}-amd64"
      - "ghcr.io/mpv/kir:{{ .Version }}-arm64"
  - name_template: "ghcr.io/mpv/kir:latest"
    image_templates:
      - "ghcr.io/mpv/kir:{{ .Version }}-amd64"
      - "ghcr.io/mpv/kir:{{ .Version }}-arm64"

