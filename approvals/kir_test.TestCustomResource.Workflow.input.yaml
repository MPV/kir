apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  name: pipeline
spec:
  entrypoint: main
  templates:
    - name: main
      dag:
        tasks:
          - name: build
            template: build
    - name: build
      container:
        image: builder:1.2.0
        command: [make]
    - name: report
      script:
        image: python:3.12
        source: |
          print("done")
    - name: approve
      suspend: {}
