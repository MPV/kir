apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: my-rollout
spec:
  replicas: 3
  strategy:
    canary:
      steps:
      - setWeight: 20
  template:
    spec:
      containers:
      - name: app
        image: my-registry/app:1.4.2
      initContainers:
      - name: setup
        image: busybox:1.36
